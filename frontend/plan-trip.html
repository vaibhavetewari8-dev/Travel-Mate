<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Your Trip - TravelMate</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h2>✈ TravelMate</h2>

        <nav>
            <a href="home.html">Home</a>
            <a href="plan-trip.html">Plan Trip</a>
            <a href="#">About</a>
        </nav>
    </header>

    <!-- Trip Form -->
    <main>

        <h1>Plan Your Trip</h1>

        <p>Enter your trip details below.</p>

        <form>

            <label for="tripName">Trip Name:</label><br>
            <input type="text" id="tripName" name="tripName"
                   placeholder="Enter trip name"><br><br>

            <label for="destination">Destination:</label><br>
            <input type="text" id="destination" name="destination"
                   placeholder="Enter destination"><br><br>

            <label for="description">Description:</label><br>
            <textarea id="description" name="description"
                      placeholder="Enter trip description"></textarea><br><br>

            <label for="startDate">Start Date:</label><br>
            <input type="date" id="startDate" name="startDate"><br><br>

            <label for="endDate">End Date:</label><br>
            <input type="date" id="endDate" name="endDate"><br><br>

            <label for="budget">Budget:</label><br>
            <input type="number" id="budget" name="budget"
                   placeholder="Enter your budget"><br><br>

            <button type="submit">Save Trip</button>
            <button type="reset">Cancel</button>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 TravelMate | Plan. Explore. Travel.</p>
    </footer>

</body>

</html>
