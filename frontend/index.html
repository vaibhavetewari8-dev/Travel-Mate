<!DOCTYPE html>
<html>
<head>
    <title>TravelMate</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 0;
            text-align: center;
            color: white;
        }

        .container {
            background: white;
            color: black;
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border-radius: 6px;
        }

        button {
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
        }

        .card {
            background: #f4f4f4;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            text-align: left;
        }

        img {
            width: 100%;
            border-radius: 8px;
        }
    </style>

</head>

<body>

<h1>🌍 TravelMate</h1>

<div class="container">

    <input type="text" id="destination" placeholder="Enter Destination">
    <input type="number" id="days" placeholder="Days">
    <input type="number" id="budget" placeholder="Budget ₹">

    <select id="type">
        <option value="">Travel Type</option>
        <option value="solo">Solo</option>
        <option value="family">Family</option>
        <option value="friends">Friends</option>
    </select>

    <button onclick="planTrip()">Plan Trip 🚀</button>

    <div id="output"></div>

</div>

<script>

function planTrip() {

    let dest = document.getElementById("destination").value;
    let days = parseInt(document.getElementById("days").value);
    let budget = parseInt(document.getElementById("budget").value);
    let type = document.getElementById("type").value;

    if (!dest || !days || !budget || !type) {
        alert("Fill all details!");
        return;
    }

    let daily = Math.floor(budget / days);

    // ✅ STATIC IMAGES (WORK EVERYWHERE)
    let mainImg = "https://images.unsplash.com/photo-1507525428034-b723cf961d3e";
    let foodImg = "https://images.unsplash.com/photo-1504674900247-0877df9cc836";
    let travelImg = "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800";

    let places = {
        solo: ["Cafe ☕", "Museum 🏛️", "Nature 🌿"],
        family: ["Park 🌳", "Zoo 🐘", "Temple 🛕"],
        friends: ["Beach 🏖️", "Club 🎉", "Adventure 🎢"]
    };

    let itinerary = "";
    for (let i = 1; i <= days; i++) {
        let place = places[type][i % 3];
        itinerary += "<li>Day " + i + ": Visit " + place + "</li>";
    }

    let stay = Math.floor(budget * 0.4);
    let food = Math.floor(budget * 0.3);
    let travel = Math.floor(budget * 0.3);

    document.getElementById("output").innerHTML = `

        <div class="card">
            <img src="${mainImg}">
            <h3>📍 ${dest}</h3>
            <p>🗓️ ${days} Days</p>
            <p>💰 ₹${budget}</p>
            <p>📊 Daily Budget: ₹${daily}</p>
        </div>

        <div class="card">
            <img src="${travelImg}">
            <h3>💸 Budget Breakdown</h3>
            <p>🏨 Stay: ₹${stay}</p>
            <p>🍽️ Food: ₹${food}</p>
            <p>🚕 Travel: ₹${travel}</p>
        </div>

        <div class="card">
            <h3>📅 Itinerary</h3>
            <ul>${itinerary}</ul>
        </div>

        <div class="card">
            <img src="${foodImg}">
            <h3>🍜 Food Suggestions</h3>
            <p>Explore local food in ${dest}</p>
        </div>

        <div class="card">
            <h3>🧳 Essentials</h3>
            <ul>
                <li>👕 Clothes</li>
                <li>🪪 ID Proof</li>
                <li>🔌 Charger</li>
                <li>💵 Cash</li>
            </ul>
        </div>

    `;
}

</script>

</body>
</html>
