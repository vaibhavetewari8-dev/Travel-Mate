<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelMate</title>
  <link rel="stylesheet" href="css/style.css">
  
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"></head>
<body>

  <header class="navbar">
    <div class="logo">✈️ TravelMate</div>
    <button class="btn primary" id="newTripBtn">+ New Trip</button>
  </header>

  <main class="container">

    <!-- TRIP LIST VIEW -->
    

    <section id="tripListView">
      <h1>Your Trips</h1>
      <div id="tripList" class="trip-grid"></div>
    </section>

    <!-- TRIP DETAIL VIEW -->
    <section id="tripDetailView" class="hidden">
      <button class="btn ghost" id="backBtn">← Back to trips</button>

      <div class="trip-header">
        <div>
          <h1 id="detailTripName"></h1>
          <p id="detailTripDestination" class="muted"></p>
          <p id="detailTripDates" class="muted"></p>
        </div>
        <button class="btn danger" id="deleteTripBtn">Delete Trip</button>
      </div>

      <p id="detailTripDescription" class="description"></p>

      <div class="tabs">
        <button class="tab-btn active" data-tab="itinerary">Itinerary</button>
        <button class="tab-btn" data-tab="expenses">Expenses</button>
        <button class="tab-btn" data-tab="budget">Budget</button>
      </div>

      <!-- ITINERARY TAB -->
      <div class="tab-panel" id="itineraryPanel">
        <div class="panel-header">
          <h2>Day-by-day Itinerary</h2>
          <button class="btn secondary" id="addDayBtn">+ Add Day</button>
        </div>
        <div id="itineraryList" class="itinerary-list"></div>
      </div>

      <!-- EXPENSES TAB -->
      <div class="tab-panel hidden" id="expensesPanel">
        <div class="panel-header">
          <h2>Expenses</h2>
          <button class="btn secondary" id="addExpenseBtn">+ Add Expense</button>
        </div>
        <table class="expense-table">
          <thead>
            <tr><th>Title</th><th>Category</th><th>Date</th><th>Amount</th><th></th></tr>
          </thead>
          <tbody id="expenseList"></tbody>
        </table>
      </div>

      <!-- BUDGET TAB -->
      <div class="tab-panel hidden" id="budgetPanel">
        <h2>Budget Overview</h2>
        <div class="budget-summary" id="budgetSummary"></div>
        <div id="categoryBreakdown"></div>
      </div>
    </section>
  
    <!-- AUTO FARE ESTIMATOR -->
<section id="fare-estimator">
    <h1>Auto Fare Estimator</h1>
    <p>Estimate your auto fare in Agra.</p>

    <div id="map"></div>

    <div id="fare-banner" class="hidden">
        <h2>Reality-Check Estimate</h2>
        <p id="distance-text">Distance: -- km</p>
        <p id="fare-range" class="highlight">
            Fair Range: ₹-- to ₹--
        </p>
        <p class="warning">
            Do not pay more than ₹<span id="max-cap">--</span>.
        </p>
    </div>
</section>
<!-- END AUTO FARE ESTIMATOR -->
</main>

  <!-- MODALS -->
  <div class="modal-overlay hidden" id="tripModal">
    <div class="modal">
      <h2>New Trip</h2>
      <label>Trip Name</label>
      <input type="text" id="tripName" placeholder="e.g. Goa Getaway">
      <label>Destination</label>
      <input type="text" id="tripDestination" placeholder="e.g. Goa, India">
      <label>Description</label>
      <textarea id="tripDescription" placeholder="What's this trip about?"></textarea>
      <div class="row">
        <div>
          <label>Start Date</label>
          <input type="date" id="tripStart">
        </div>
        <div>
          <label>End Date</label>
          <input type="date" id="tripEnd">
        </div>
      </div>
      <label>Budget (₹)</label>
      <input type="number" id="tripBudget" placeholder="e.g. 20000">
      <div class="modal-actions">
        <button class="btn ghost" id="cancelTripBtn">Cancel</button>
        <button class="btn primary" id="saveTripBtn">Save Trip</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="dayModal">
    <div class="modal">
      <h2>Add Itinerary Day</h2>
      <label>Day Number</label>
      <input type="number" id="dayNumber" value="1" min="1">
      <label>Date</label>
      <input type="date" id="dayDate">
      <label>Title</label>
      <input type="text" id="dayTitle" placeholder="e.g. Arrival & Beach Walk">
      <label>Description</label>
      <textarea id="dayDescription" placeholder="Plan for the day..."></textarea>
      <div class="modal-actions">
        <button class="btn ghost" id="cancelDayBtn">Cancel</button>
        <button class="btn primary" id="saveDayBtn">Save Day</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="expenseModal">
    <div class="modal">
      <h2>Add Expense</h2>
      <label>Title</label>
      <input type="text" id="expenseTitle" placeholder="e.g. Hotel booking">
      <label>Category</label>
      <select id="expenseCategory">
        <option>Accommodation</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Activities</option>
        <option>Shopping</option>
        <option>General</option>
      </select>
      <label>Amount (₹)</label>
      <input type="number" id="expenseAmount" placeholder="e.g. 3000">
      <label>Date</label>
      <input type="date" id="expenseDate">
      <label>Notes</label>
      <textarea id="expenseNotes" placeholder="Optional notes"></textarea>
      <div class="modal-actions">
        <button class="btn ghost" id="cancelExpenseBtn">Cancel</button>
        <button class="btn primary" id="saveExpenseBtn">Save Expense</button>
      </div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script src="js/map.js"></script>

</body>
</html>
